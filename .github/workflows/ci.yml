name: CI

on:
  push:
    branches: [master, 'feat/**']
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Each step is a separate gate so a failure names itself in the UI.
      - name: Lint (TypeScript and templates)
        run: npm run lint

      - name: Lint (styles)
        run: npm run stylelint

      - name: Check formatting
        run: npm run format:check

      - name: Check i18n drift
        run: npm run i18n:check

      - name: Check colour contrast (WCAG 2.2 AA)
        run: npm run contrast:check

      # The resolver types are generated from schema.graphql. A stale file means
      # someone changed the schema without regenerating.
      - name: Check generated code is up to date
        run: npm run codegen:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:coverage

      # Budgets are errors in angular.json, so an oversized bundle fails here.
      - name: Production build
        run: npm run build

      - name: Check bundle boundaries
        run: npm run bundle:check

      # The end-to-end tests drive the production build that was just made, in a real
      # browser, with no network access to anything but the local server.
      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            e2e/.results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: ignore
